<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sonic 3D – Warp Rings</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Segoe UI',sans-serif; }
#c { display:block; width:100vw; height:100vh; }
#hud {
  position:fixed; top:0; left:0; right:0;
  display:flex; justify-content:space-between; align-items:flex-start;
  padding:14px 24px; pointer-events:none;
}
.hud-box {
  background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.2);
  border-radius:10px; padding:8px 18px; color:#fff; font-size:1rem;
  backdrop-filter:blur(4px);
}
.hud-box span { color:#FFD700; font-weight:bold; font-size:1.2rem; }
#zone-name {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  color:#fff; font-size:2.8rem; font-weight:bold;
  text-shadow:0 0 20px currentColor, 2px 2px 4px #000;
  pointer-events:none; opacity:0; transition:opacity 0.5s;
  letter-spacing:3px; text-align:center;
}
#tips {
  position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,0.7); font-size:0.82rem; pointer-events:none;
  background:rgba(0,0,0,0.4); padding:6px 18px; border-radius:20px;
}
#overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.88);
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:20px; color:#fff; z-index:10;
}
#overlay h1 { font-size:3.5rem; color:#1E90FF; text-shadow:0 0 30px #1E90FF; }
#overlay p { font-size:1.1rem; color:#aaa; max-width:440px; text-align:center; line-height:1.7; }
#overlay button {
  background:#1E90FF; color:#fff; border:none; padding:14px 44px;
  font-size:1.15rem; border-radius:8px; cursor:pointer; font-family:inherit;
  transition:background 0.2s;
}
#overlay button:hover { background:#60b8ff; }
#flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:9; }
#spindash-bar {
  position:fixed; bottom:50px; left:50%; transform:translateX(-50%);
  width:200px; height:12px; background:rgba(0,0,0,0.5);
  border-radius:6px; overflow:hidden; opacity:0; transition:opacity 0.3s;
  border:1px solid rgba(255,255,255,0.3);
}
#spindash-fill { height:100%; width:0; background:linear-gradient(90deg,#FFD700,#FF4500); border-radius:6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="hud-box">💍 Rings: <span id="ring-count">0</span></div>
  <div class="hud-box" id="zone-display">Zone 1</div>
  <div class="hud-box">🌀 Warps: <span id="warp-count">0</span></div>
</div>
<div id="zone-name"></div>
<div id="tips">WASD/Flechas: Mover &nbsp;|&nbsp; Espacio: Saltar &nbsp;|&nbsp; Shift: Spindash &nbsp;|&nbsp; Clic: Lanzar Warp Ring &nbsp;|&nbsp; Arrastrar ratón: Girar cámara</div>
<div id="spindash-bar"><div id="spindash-fill"></div></div>
<div id="flash"></div>
<div id="overlay">
  <h1>⚡ SONIC 3D ⚡</h1>
  <p>Corre a máxima velocidad, recoge anillos y lanza el <b style="color:#FFD700">Warp Ring</b> para teletransportarte a otra zona. ¡Hay 5 zonas para explorar!</p>
  <button onclick="startGame()">¡JUGAR!</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Renderer / Scene / Camera ───────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(65, 1, 0.1, 400);

function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// ─── Zones definition ─────────────────────────────────────────────────────────
const ZONES = [
  { name:'Green Hill Zone',   sky:0x5fb8ea, fog:0x5fb8ea,  ground:0x4a9c22, plat:0x8B4513, accent:0xffee00, emissive:0x001a00, ring:0x00ff88 },
  { name:'Casino Night Zone', sky:0x08082a, fog:0x08082a,  ground:0x1a1a5e, plat:0x880022, accent:0xff2090, emissive:0x0a0020, ring:0xff88ff },
  { name:'Chemical Plant',    sky:0x2a0060, fog:0x2a0060,  ground:0x001a44, plat:0x0055bb, accent:0x00ffcc, emissive:0x100020, ring:0x00ffcc },
  { name:'Ice Cap Zone',      sky:0xaad8f8, fog:0xaad8f8,  ground:0xd0e8ff, plat:0x7799cc, accent:0xffffff, emissive:0x203040, ring:0xaaddff },
  { name:'Lava Reef Zone',    sky:0x100000, fog:0x1a0000,  ground:0x2a0000, plat:0x440000, accent:0xff4400, emissive:0x300000, ring:0xff6600 },
];

let currentZone = 0;
let gameRunning = false;
let ringCount = 0;
let warpCount = 0;
let transitioning = false;

// ─── Lights ──────────────────────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
sunLight.position.set(20, 40, 20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048,2048);
sunLight.shadow.camera.left = -80;
sunLight.shadow.camera.right = 80;
sunLight.shadow.camera.top = 60;
sunLight.shadow.camera.bottom = -20;
sunLight.shadow.camera.far = 200;
scene.add(sunLight);
scene.add(sunLight.target);

// ─── Materials cache ─────────────────────────────────────────────────────────
const matCache = {};
function getMat(color, emissive=0, metalness=0, roughness=0.8) {
  const key = `${color}_${emissive}`;
  if (!matCache[key]) matCache[key] = new THREE.MeshStandardMaterial({ color, emissive, metalness, roughness });
  return matCache[key];
}

// ─── Geometry helpers ─────────────────────────────────────────────────────────
function addBox(w,h,d,mat,x,y,z,parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  parent.add(m); return m;
}
function addSphere(r,mat,x,y,z,parent) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r,16,12), mat);
  m.position.set(x,y,z); m.castShadow=true;
  parent.add(m); return m;
}
function addCyl(rt,rb,h,seg,mat,x,y,z,parent) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z); m.castShadow=true;
  parent.add(m); return m;
}

// ─── Build Sonic ──────────────────────────────────────────────────────────────
function buildSonic() {
  const root = new THREE.Group();
  // Body
  const body = addSphere(0.55, getMat(0x1E5FFF), 0, 0.55, 0, root);
  body.scale.y = 1.15;
  // Belly patch
  addSphere(0.3, getMat(0xf5c89a), 0.28, 0.45, 0.38, root);
  // Head
  const head = addSphere(0.52, getMat(0x1E5FFF), 0, 1.32, 0, root);
  // Face
  addSphere(0.28, getMat(0xf5c89a), 0.18, 1.22, 0.38, root); // muzzle
  // Eyes
  addSphere(0.13, getMat(0xffffff), 0.22, 1.42, 0.42, root);
  addSphere(0.08, getMat(0x00aa00), 0.29, 1.42, 0.50, root); // iris
  addSphere(0.04, getMat(0x000000), 0.34, 1.42, 0.55, root); // pupil
  // Spikes (3 back spikes)
  const spikeMat = getMat(0x1848cc);
  for(let i=0;i<3;i++){
    const sp = new THREE.Mesh(new THREE.ConeGeometry(0.12,0.7,6), spikeMat);
    sp.rotation.z = Math.PI/2 + (i-1)*0.35;
    sp.position.set(-0.55 - i*0.12, 1.3 - i*0.22, 0);
    sp.castShadow=true; root.add(sp);
  }
  // Legs
  const legL = addSphere(0.22, getMat(0x1E5FFF), -0.22, 0, 0, root);
  const legR = addSphere(0.22, getMat(0x1E5FFF),  0.22, 0, 0, root);
  // Shoes
  const shoeL = addBox(0.32,0.22,0.5, getMat(0xdd2222), -0.22,-0.32,0.08, root);
  const shoeR = addBox(0.32,0.22,0.5, getMat(0xdd2222),  0.22,-0.32,0.08, root);
  // Gloves
  const gloveL = addSphere(0.2, getMat(0xffffff), -0.65, 0.6, 0.1, root);
  const gloveR = addSphere(0.2, getMat(0xffffff),  0.65, 0.6, 0.1, root);
  // Buckle on shoes
  addBox(0.1,0.08,0.08, getMat(0xffd700), -0.22,-0.26,0.3, root);
  addBox(0.1,0.08,0.08, getMat(0xffd700),  0.22,-0.26,0.3, root);

  root._legL=legL; root._legR=legR;
  root._shoeL=shoeL; root._shoeR=shoeR;
  root._gloveL=gloveL; root._gloveR=gloveR;
  root._head=head;
  root._walkPhase=0;
  root._spinPhase=0;
  return root;
}

// ─── Build Badnik (enemy) ─────────────────────────────────────────────────────
function buildBadnik(zoneIdx) {
  const z = ZONES[zoneIdx];
  const root = new THREE.Group();
  addBox(0.8,0.6,0.8, getMat(z.plat), 0, 0.3, 0, root);
  addSphere(0.35, getMat(z.accent, z.emissive), 0, 0.8, 0, root);
  addBox(0.2,0.5,0.2, getMat(z.ground), -0.25,-0.2,0, root);
  addBox(0.2,0.5,0.2, getMat(z.ground),  0.25,-0.2,0, root);
  // Eye
  addSphere(0.12, getMat(0xff0000, 0x440000), 0, 0.82, 0.32, root);
  root.castShadow=true;
  return root;
}

// ─── Warp Ring projectile ─────────────────────────────────────────────────────
class WarpRingProjectile {
  constructor(pos, dir) {
    this.vel = dir.clone().multiplyScalar(0.42);
    this.vel.y += 0.18;
    this.gravity = 0.012;
    this.landed = false;
    this.active = true;
    this.portalActive = false;
    this.portalScale = 0;

    // Ring mesh (torus)
    this.mesh = new THREE.Mesh(
      new THREE.TorusGeometry(0.6, 0.12, 12, 32),
      new THREE.MeshStandardMaterial({ color:0xFFD700, emissive:0xaa6600, metalness:0.8, roughness:0.2 })
    );
    this.mesh.position.copy(pos);
    scene.add(this.mesh);

    // Trail
    this.trail = [];
    this.trailMat = new THREE.MeshBasicMaterial({ color:0xFFD700, transparent:true, opacity:0.5 });

    // Portal ring (big, vertical)
    this.portal = new THREE.Mesh(
      new THREE.TorusGeometry(2.2, 0.28, 16, 48),
      new THREE.MeshStandardMaterial({ color:0xFFD700, emissive:0xdd8800, transparent:true, opacity:0 })
    );
    this.portalInner = new THREE.Mesh(
      new THREE.CircleGeometry(2.0, 48),
      new THREE.MeshBasicMaterial({ color:0x88ffff, transparent:true, opacity:0, side:THREE.DoubleSide })
    );
    this.portal.add(this.portalInner);
    scene.add(this.portal);

    // Glow point light
    this.light = new THREE.PointLight(0xFFD700, 2, 8);
    this.mesh.add(this.light);
  }

  update(dt) {
    if (!this.active) return;
    if (!this.landed) {
      this.vel.y -= this.gravity;
      this.mesh.position.add(this.vel);
      this.mesh.rotation.y += 0.15;
      this.mesh.rotation.x += 0.1;

      // Trail
      if (Math.random() > 0.4) {
        const t = new THREE.Mesh(
          new THREE.SphereGeometry(0.1, 4, 4), this.trailMat.clone()
        );
        t.position.copy(this.mesh.position);
        t._life = 1.0;
        scene.add(t);
        this.trail.push(t);
      }

      if (this.mesh.position.y <= 0.5 || this.trail.length > 300) {
        this.land();
      }
    } else {
      // Expand portal
      if (this.portalScale < 1) {
        this.portalScale = Math.min(1, this.portalScale + 0.04);
        this.portal.scale.setScalar(this.portalScale);
        this.portal.material.opacity = this.portalScale * 0.9;
        this.portalInner.material.opacity = this.portalScale * 0.35;
        this.portalActive = this.portalScale > 0.7;
      }
      this.portal.rotation.y += 0.02;
      this.light.position.copy(this.portal.position);
      this.light.intensity = 2 + Math.sin(Date.now()*0.005)*0.8;
    }

    // Update trail
    this.trail = this.trail.filter(t => {
      t._life -= 0.06;
      t.material.opacity = t._life * 0.5;
      t.scale.setScalar(t._life);
      if (t._life <= 0) { scene.remove(t); return false; }
      return true;
    });
  }

  land() {
    this.landed = true;
    const p = this.mesh.position.clone();
    p.y = 0.1;
    this.portal.position.copy(p);
    this.portal.rotation.x = 0;
    scene.remove(this.mesh);
    this.light = new THREE.PointLight(0xFFD700, 3, 12);
    this.light.position.copy(p);
    scene.add(this.light);
    // Spawn ring particles
    for(let i=0;i<20;i++){
      spawnParticle(p, 0xFFD700, new THREE.Vector3((Math.random()-0.5)*0.3, 0.1+Math.random()*0.3, (Math.random()-0.5)*0.3));
    }
  }

  destroy() {
    scene.remove(this.mesh);
    scene.remove(this.portal);
    scene.remove(this.light);
    this.trail.forEach(t => scene.remove(t));
    this.active = false;
  }
}

// ─── Particles ────────────────────────────────────────────────────────────────
const particles = [];
function spawnParticle(pos, color, vel, life=1.0) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.12+Math.random()*0.1, 4, 4),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:1 })
  );
  m.position.copy(pos);
  scene.add(m);
  particles.push({ mesh:m, vel:vel.clone(), life, decay:0.025+Math.random()*0.03 });
}
function updateParticles() {
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.mesh.position.add(p.vel);
    p.vel.y -= 0.012;
    p.life -= p.decay;
    p.mesh.material.opacity = p.life;
    if(p.life<=0){ scene.remove(p.mesh); particles.splice(i,1); }
  }
}

// ─── Collectible rings ────────────────────────────────────────────────────────
const collectRings = [];
function spawnRingLine(startX, y, z, count, spacing, zoneIdx) {
  const col = ZONES[zoneIdx].ring;
  for(let i=0;i<count;i++){
    const mesh = new THREE.Mesh(
      new THREE.TorusGeometry(0.28,0.06,8,24),
      new THREE.MeshStandardMaterial({ color:0xFFD700, emissive:0x443300, metalness:0.9, roughness:0.1 })
    );
    mesh.position.set(startX+i*spacing, y+0.6, z);
    mesh.rotation.x = Math.PI/2;
    scene.add(mesh);
    const light = new THREE.PointLight(col, 0.6, 2.5);
    mesh.add(light);
    collectRings.push({ mesh, collected:false, x:startX+i*spacing, y:y+0.6, z });
  }
}

// ─── Enemies ─────────────────────────────────────────────────────────────────
const badniks = [];
function spawnBadnik(x, y, z, rangeX, zoneIdx) {
  const mesh = buildBadnik(zoneIdx);
  mesh.position.set(x, y+0.7, z);
  scene.add(mesh);
  badniks.push({ mesh, x, y:y+0.7, z, startX:x, rangeX, vx:0.04, stomped:false });
}

// ─── Speed lines ──────────────────────────────────────────────────────────────
const speedLines = [];
function buildSpeedLines() {
  const mat = new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0 });
  for(let i=0;i<30;i++){
    const pts = [new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,4)];
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const line = new THREE.Line(geo, mat.clone());
    line.position.set((Math.random()-0.5)*6, (Math.random()-0.5)*4+1.5, 0);
    cam.add(line);
    speedLines.push(line);
  }
  scene.add(cam);
}

// ─── Zone Builder ────────────────────────────────────────────────────────────
const zoneObjects = [];
function clearZone() {
  for(const o of zoneObjects) scene.remove(o);
  zoneObjects.length = 0;
  collectRings.forEach(r => scene.remove(r.mesh));
  collectRings.length = 0;
  badniks.forEach(b => scene.remove(b.mesh));
  badniks.length = 0;
  if(warpRing){ warpRing.destroy(); warpRing=null; }
}

function addZoneObj(mesh){ scene.add(mesh); zoneObjects.push(mesh); }

function buildZone(idx) {
  clearZone();
  const z = ZONES[idx];

  // Scene visuals
  scene.background = new THREE.Color(z.sky);
  scene.fog = new THREE.Fog(z.fog, 40, 150);
  ambientLight.color.setHex(z.sky);
  ambientLight.intensity = (idx===1||idx===4) ? 0.3 : 0.55;
  sunLight.color.setHex(idx===1 ? 0xff88ff : idx===4 ? 0xff4400 : 0xffffff);
  sunLight.intensity = idx===1 ? 0.6 : 1.0;

  const gMat = getMat(z.ground, z.emissive);
  const pMat = getMat(z.plat);
  const aMat = getMat(z.accent, z.emissive|0x111111, 0.5, 0.4);

  const layouts = [buildGreenHill, buildCasino, buildChemPlant, buildIceCap, buildLavaReef];
  layouts[idx](gMat, pMat, aMat, idx);

  document.getElementById('zone-display').textContent = z.name;
  showZoneName(z.name, z.accent);

  // Sonic spawn
  sonicState.x=0; sonicState.y=1; sonicState.z=0;
  sonicState.vx=sonicState.vy=sonicState.vz=0;
  sonicState.onGround=false; sonicState.invincible=60;
  sonicMesh.position.set(0,1,0);
}

function ground(gMat, w, d, x, z, idx) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,1.5,d), gMat);
  m.position.set(x,-0.75,z); m.receiveShadow=true; m.castShadow=false;
  addZoneObj(m);
  // Grid lines
  if(idx===0){
    const geoG = new THREE.EdgesGeometry(new THREE.BoxGeometry(w,0.05,d));
    const matG = new THREE.LineSegments(geoG, new THREE.LineBasicMaterial({color:0xffee00,opacity:0.25,transparent:true}));
    matG.position.set(x,0,z); addZoneObj(matG);
  }
  return m;
}

function plat(pMat, w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), pMat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  addZoneObj(m); return m;
}

function spring(x,y,z, idx) {
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.3,16), getMat(0x888888));
  base.position.set(x,y+0.15,z); addZoneObj(base);
  const coil = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,0.8,16), getMat(0xdd0000,0x440000));
  coil.position.set(x,y+0.7,z); addZoneObj(coil);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.15,16), getMat(0xff4444,0x330000));
  top.position.set(x,y+1.15,z); addZoneObj(top);
  return { x, y:y+1.15, z, active:false };
}

const springs = [];

function buildGreenHill(gMat, pMat, aMat, idx) {
  ground(gMat,120,20,0,0,idx);
  // Hills (raised ground sections)
  for(let i=-2;i<=2;i++){
    const m = new THREE.Mesh(new THREE.SphereGeometry(8+Math.random()*4, 12,8), gMat);
    m.scale.y=0.35; m.position.set(i*22, -1, -6); m.receiveShadow=true; addZoneObj(m);
  }
  // Platforms
  plat(pMat,8,1,4, -20,3,0);
  plat(pMat,6,1,4, -10,5,0);
  plat(pMat,10,1,4,  5,4,0);
  plat(pMat,6,1,4,  18,7,0);
  plat(pMat,8,1,4,  30,3,0);
  plat(pMat,6,1,4,  40,6,0);
  // Checkerboard pillars
  for(let i=0;i<6;i++){
    const p = plat(aMat, 2,6,2, -30+i*13, 3, -6);
  }
  // Trees
  for(let i=0;i<12;i++){
    const tx=Math.random()*100-50, tz=-8-Math.random()*10;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,2,8), getMat(0x5c3310));
    trunk.position.set(tx,1,tz); addZoneObj(trunk);
    const top = new THREE.Mesh(new THREE.SphereGeometry(1.4+Math.random(),8,6), getMat(0x228822));
    top.position.set(tx,3.2,tz); addZoneObj(top);
  }
  springs.length=0;
  springs.push(spring(12,0,0,idx));
  springs.push(spring(-25,0,0,idx));
  spawnRingLine(-40,0,0, 8,2.5, idx);
  spawnRingLine(0,4,0, 5,2, idx);
  spawnRingLine(20,0,0, 10,2, idx);
  spawnBadnik(-15,0,0, 8, idx);
  spawnBadnik(10,0,0, 10, idx);
  spawnBadnik(35,0,0, 10, idx);
  spawnBadnik(-5,4,0, 4, idx);
}

function buildCasino(gMat, pMat, aMat, idx) {
  ground(gMat,120,16,0,0,idx);
  // Neon platforms
  const cols=[0xff2090,0x00ffff,0xffff00,0xff8800];
  for(let i=0;i<8;i++){
    plat(getMat(cols[i%4], cols[i%4]>>1, 0.6,0.3), 5,0.8,3, -30+i*10, 3+i%3*3, 0);
  }
  plat(pMat,20,1,4, 0,2,0);
  plat(pMat,8,1,4, 25,7,0);
  plat(pMat,8,1,4,-25,7,0);
  // Bumpers
  for(let i=0;i<6;i++){
    const bx=Math.random()*60-30, by=Math.random()*5+1;
    const b = new THREE.Mesh(new THREE.SphereGeometry(1.2,16,10), getMat(0xff2090,0x440033,0.8,0.2));
    b.position.set(bx,by,0); b.castShadow=true; addZoneObj(b);
    const l = new THREE.PointLight(0xff2090,1.5,6); b.add(l);
  }
  // Neon signs
  for(let i=0;i<5;i++){
    const s = new THREE.Mesh(new THREE.BoxGeometry(4,1.5,0.2), getMat(0,cols[i%4],0,1));
    s.position.set(-20+i*10, 8, -5); addZoneObj(s);
    const l2=new THREE.PointLight(cols[i%4],1.2,8); s.add(l2);
  }
  springs.length=0;
  springs.push(spring(-10,0,0,idx));
  springs.push(spring(10,0,0,idx));
  spawnRingLine(-40,0,0, 12,2, idx);
  spawnRingLine(-5,2.4,0, 6,2, idx);
  spawnBadnik(-20,0,0, 12, idx);
  spawnBadnik(15,0,0, 10, idx);
  spawnBadnik(35,0,0, 8, idx);
}

function buildChemPlant(gMat, pMat, aMat, idx) {
  ground(gMat,130,12,0,0,idx);
  // Long horizontal platforms
  for(let i=0;i<5;i++){
    plat(pMat, 12,1,4, -40+i*18, 4+i*1.5, 0);
    // Pipes
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,20,12), getMat(0x0066aa,0x001a33));
    pipe.rotation.z=Math.PI/2; pipe.position.set(-30+i*16,6,-4);
    addZoneObj(pipe);
    const l = new THREE.PointLight(0x00ffcc,0.8,5); pipe.add(l);
  }
  plat(pMat,6,1,4,-10,8,0);
  plat(pMat,6,1,4,10,11,0);
  // Chemical vats
  for(let i=0;i<4;i++){
    const vat = new THREE.Mesh(new THREE.CylinderGeometry(2,2.5,4,16), getMat(0x0055bb,0x002244));
    vat.position.set(-30+i*20,-1.5,-7); addZoneObj(vat);
    const l=new THREE.PointLight(0x00ffcc,1.2,8); vat.add(l);
  }
  springs.length=0;
  springs.push(spring(0,0,0,idx));
  spawnRingLine(-50,0,0, 14,2.2, idx);
  spawnRingLine(0,8,0, 5,2, idx);
  spawnBadnik(-25,0,0, 10, idx);
  spawnBadnik(5,0,0, 10, idx);
  spawnBadnik(30,0,0, 10, idx);
}

function buildIceCap(gMat, pMat, aMat, idx) {
  ground(gMat,120,18,0,0,idx);
  // Snow hills
  for(let i=-3;i<=3;i++){
    const hill = new THREE.Mesh(new THREE.SphereGeometry(10,12,8), getMat(0xffffff,0x203040));
    hill.scale.y=0.3; hill.position.set(i*18,-2.5,-8); hill.receiveShadow=true; addZoneObj(hill);
  }
  // Ice platforms
  for(let i=0;i<7;i++){
    plat(getMat(0xaaccee,0x203040,0.9,0.05), 7,0.5,4, -30+i*10, 3+Math.sin(i)*2, 0);
  }
  // Snowflakes (decorative)
  for(let i=0;i<20;i++){
    const s = new THREE.Mesh(new THREE.OctahedronGeometry(0.2+Math.random()*0.2,0), getMat(0xffffff,0x202040));
    s.position.set(Math.random()*100-50, Math.random()*12+2, Math.random()*10-10);
    addZoneObj(s);
  }
  springs.length=0;
  springs.push(spring(-20,0,0,idx));
  springs.push(spring(20,0,0,idx));
  spawnRingLine(-45,0,0, 10,2.5, idx);
  spawnRingLine(-10,2.8,0, 6,2, idx);
  spawnBadnik(-30,0,0, 12, idx);
  spawnBadnik(0,0,0, 10, idx);
  spawnBadnik(25,0,0, 10, idx);
  spawnBadnik(-8,3,0, 5, idx);
}

function buildLavaReef(gMat, pMat, aMat, idx) {
  ground(gMat,130,12,0,0,idx);
  // Lava pools (emissive planes)
  for(let i=0;i<5;i++){
    const lava = new THREE.Mesh(new THREE.BoxGeometry(12,0.3,8), getMat(0xff2200,0xcc1100,0,1));
    lava.position.set(-40+i*18,-0.1,-5); addZoneObj(lava);
    const l=new THREE.PointLight(0xff4400,2,12); lava.add(l);
  }
  // Rocky platforms
  for(let i=0;i<6;i++){
    const rock = plat(pMat, 6+Math.random()*3, 1.5,4, -35+i*13, 3+i%3*2.5, 0);
    // Crack lines
    const edge = new THREE.LineSegments(new THREE.EdgesGeometry(rock.geometry), new THREE.LineBasicMaterial({color:0xff4400,opacity:0.5,transparent:true}));
    rock.add(edge);
  }
  // Lava jets
  for(let i=0;i<4;i++){
    const jet = new THREE.Mesh(new THREE.ConeGeometry(0.5,3,8), getMat(0xff6600,0xcc2200,0,0.5));
    jet.position.set(-30+i*20,1.5,-4); addZoneObj(jet);
    const l=new THREE.PointLight(0xff4400,2,6); jet.add(l);
  }
  springs.length=0;
  springs.push(spring(5,0,0,idx));
  spawnRingLine(-50,0,0, 12,2, idx);
  spawnRingLine(-5,3,0, 5,2, idx);
  spawnBadnik(-20,0,0, 10, idx);
  spawnBadnik(5,0,0, 10, idx);
  spawnBadnik(28,0,0, 8, idx);
  spawnBadnik(-10,3,0, 4, idx);
}

// ─── Sonic state ──────────────────────────────────────────────────────────────
const sonicState = {
  x:0, y:1, z:0,
  vx:0, vy:0, vz:0,
  angle:0, onGround:false, invincible:0,
  spinCharging:false, spinCharge:0, spinning:false,
};
let sonicMesh;
const GRAVITY_S = 0.032;
const MAX_SPD = 0.55;
const ACCEL = 0.022;
const FRICTION = 0.84;
const ICE_FRICTION = 0.96;
const JUMP = 0.65;

// ─── Camera orbit state ───────────────────────────────────────────────────────
let camAngle = 0;
let camPitch = 0.38;
const camDist = 14;
let isDragging = false, prevMouseX = 0, prevMouseY = 0;

// ─── Warp ring ────────────────────────────────────────────────────────────────
let warpRing = null;

// ─── Keys ─────────────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('mousedown', e => {
  if(e.button===2 || e.altKey){ isDragging=true; prevMouseX=e.clientX; prevMouseY=e.clientY; }
  else if(e.button===0 && gameRunning) throwWarpRing();
});
canvas.addEventListener('mousemove', e => {
  if(isDragging){
    camAngle -= (e.clientX-prevMouseX)*0.008;
    camPitch = Math.max(0.1, Math.min(1.0, camPitch+(e.clientY-prevMouseY)*0.006));
    prevMouseX=e.clientX; prevMouseY=e.clientY;
  }
});
canvas.addEventListener('mouseup', () => isDragging=false);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('touchstart', e => {
  if(e.touches.length===2){ isDragging=true; prevMouseX=e.touches[0].clientX; }
});

function throwWarpRing() {
  if(warpRing && warpRing.active) { warpRing.destroy(); warpRing=null; }
  const pos = new THREE.Vector3(sonicState.x, sonicState.y+1, sonicState.z);
  const dir = new THREE.Vector3(Math.sin(sonicState.angle), 0, Math.cos(sonicState.angle));
  warpRing = new WarpRingProjectile(pos, dir);
  warpCount++;
  document.getElementById('warp-count').textContent = warpCount;
}

// ─── Zone name display ────────────────────────────────────────────────────────
function showZoneName(name, color) {
  const el = document.getElementById('zone-name');
  el.textContent = name;
  el.style.color = '#'+color.toString(16).padStart(6,'0');
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity='0', 2500);
}

// ─── Flash transition ─────────────────────────────────────────────────────────
function flashTransition(cb) {
  const el = document.getElementById('flash');
  transitioning = true;
  el.style.transition = 'opacity 0.3s';
  el.style.opacity = '1';
  setTimeout(() => {
    cb();
    el.style.opacity = '0';
    setTimeout(() => { transitioning=false; }, 400);
  }, 350);
}

// ─── Zone teleport ───────────────────────────────────────────────────────────
function teleportToZone(nextZone) {
  for(let i=0;i<30;i++) spawnParticle(
    new THREE.Vector3(sonicState.x, sonicState.y+1, sonicState.z),
    0xFFD700,
    new THREE.Vector3((Math.random()-0.5)*0.5, 0.1+Math.random()*0.4, (Math.random()-0.5)*0.5)
  );
  flashTransition(() => {
    currentZone = nextZone;
    buildZone(currentZone);
  });
}

// ─── Platform collision helper ────────────────────────────────────────────────
function checkPlatforms(s) {
  // Find all platform mesh boxes in scene (zoneObjects with BoxGeometry)
  let landed = false;
  const feet = s.y - 0.55;
  const prevFeet = feet - s.vy;

  for(const obj of zoneObjects) {
    if(!obj.geometry || !obj.geometry.parameters) continue;
    const g = obj.geometry.parameters;
    if(!g.width || !g.height || !g.depth) continue;
    const p = obj.position;
    const hw=g.width/2, hh=g.height/2, hd=g.depth/2;
    if(s.x > p.x-hw-0.4 && s.x < p.x+hw+0.4 &&
       s.z > p.z-hd-0.4 && s.z < p.z+hd+0.4) {
      const topY = p.y + hh;
      if(prevFeet >= topY-0.1 && feet <= topY+0.3 && s.vy <= 0) {
        s.y = topY + 0.55;
        s.vy = 0;
        landed = true;
      }
    }
  }
  return landed;
}

// ─── Main update ─────────────────────────────────────────────────────────────
function update() {
  if(!gameRunning || transitioning) return;
  const s = sonicState;
  const isIce = currentZone===3;
  const friction = isIce ? ICE_FRICTION : FRICTION;

  // Direction from camera
  const fwd = new THREE.Vector3(Math.sin(camAngle), 0, Math.cos(camAngle));
  const right = new THREE.Vector3(Math.cos(camAngle), 0, -Math.sin(camAngle));

  let moved = false;
  if(keys['ArrowLeft']  || keys['KeyA']) { s.vx -= right.x*ACCEL; s.vz -= right.z*ACCEL; moved=true; s.angle=camAngle-Math.PI/2; }
  if(keys['ArrowRight'] || keys['KeyD']) { s.vx += right.x*ACCEL; s.vz += right.z*ACCEL; moved=true; s.angle=camAngle+Math.PI/2; }
  if(keys['ArrowUp']    || keys['KeyW']) { s.vx -= fwd.x*ACCEL*1.3; s.vz -= fwd.z*ACCEL*1.3; moved=true; s.angle=camAngle+Math.PI; }
  if(keys['ArrowDown']  || keys['KeyS']) { s.vx += fwd.x*ACCEL*0.7; s.vz += fwd.z*ACCEL*0.7; moved=true; s.angle=camAngle; }

  // Spindash
  const shiftDown = keys['ShiftLeft']||keys['ShiftRight'];
  if(shiftDown && s.onGround){
    s.spinCharging=true;
    s.spinCharge=Math.min(1, s.spinCharge+0.04);
    const bar=document.getElementById('spindash-bar');
    bar.style.opacity='1';
    document.getElementById('spindash-fill').style.width=(s.spinCharge*100)+'%';
    s.spinning=true;
  } else if(s.spinCharging && !shiftDown) {
    const boost=s.spinCharge*MAX_SPD*2.2;
    s.vx -= Math.sin(s.angle)*boost;
    s.vz -= Math.cos(s.angle)*boost;
    s.spinCharging=false; s.spinCharge=0;
    s.spinning=false;
    document.getElementById('spindash-bar').style.opacity='0';
    document.getElementById('spindash-fill').style.width='0%';
    // Particles
    for(let i=0;i<12;i++) spawnParticle(
      new THREE.Vector3(s.x,s.y,s.z), 0x1E5FFF,
      new THREE.Vector3((Math.random()-0.5)*0.3, 0.08+Math.random()*0.2, (Math.random()-0.5)*0.3)
    );
  }

  // Cap speed
  const spd = Math.sqrt(s.vx*s.vx+s.vz*s.vz);
  if(spd > MAX_SPD*2) { s.vx=s.vx/spd*MAX_SPD*2; s.vz=s.vz/spd*MAX_SPD*2; }

  // Friction
  if(!moved) { s.vx*=friction; s.vz*=friction; }

  // Gravity
  s.vy -= GRAVITY_S;

  // Move
  s.x += s.vx; s.y += s.vy; s.z += s.vz;

  // Ground
  s.onGround = false;
  if(s.y <= 0.55) { s.y=0.55; s.vy=0; s.onGround=true; }
  if(checkPlatforms(s)) s.onGround=true;

  // Fall death
  if(s.y < -12) {
    ringCount = Math.max(0, ringCount-10);
    document.getElementById('ring-count').textContent=ringCount;
    s.x=0; s.y=1; s.z=0; s.vx=s.vy=s.vz=0; s.invincible=90;
    for(let i=0;i<20;i++) spawnParticle(sonicMesh.position.clone(), 0xFFD700, new THREE.Vector3((Math.random()-0.5)*0.4, 0.2+Math.random()*0.3,(Math.random()-0.5)*0.4));
  }

  // Jump
  if((keys['Space']||keys['ArrowUp']&&s.onGround) && s.onGround) {
    s.vy=JUMP; s.onGround=false; s.spinning=true;
    setTimeout(()=>{if(!keys['ShiftLeft']&&!keys['ShiftRight'])s.spinning=false;},500);
  }

  if(s.invincible>0) s.invincible--;

  // Springs
  for(const sp of springs) {
    if(Math.abs(s.x-sp.x)<1 && Math.abs(s.z-sp.z)<1 && Math.abs(s.y-sp.y)<1.2) {
      s.vy=1.4; s.onGround=false;
      spawnParticle(new THREE.Vector3(sp.x,sp.y+0.5,sp.z), 0xffff00, new THREE.Vector3(0,0.2,0));
    }
  }

  // Animate sonic
  const moving = Math.sqrt(s.vx*s.vx+s.vz*s.vz) > 0.02;
  sonicMesh._walkPhase += moving ? 0.25 : 0;
  sonicMesh._spinPhase += s.spinning ? 0.35 : 0;
  if(s.spinning) {
    sonicMesh.rotation.x = sonicMesh._spinPhase;
  } else {
    sonicMesh.rotation.x *= 0.8;
    sonicMesh.rotation.y = s.angle;
  }
  const lsw = Math.sin(sonicMesh._walkPhase)*0.4;
  sonicMesh._legL.position.y = -0.1 + Math.sin(sonicMesh._walkPhase)*0.15;
  sonicMesh._legR.position.y = -0.1 - Math.sin(sonicMesh._walkPhase)*0.15;
  sonicMesh._shoeL.position.y = -0.32 + Math.sin(sonicMesh._walkPhase)*0.18;
  sonicMesh._shoeR.position.y = -0.32 - Math.sin(sonicMesh._walkPhase)*0.18;
  // Squash/stretch
  const sFactor = s.onGround ? (moving ? 1.05 : 0.95) : (s.vy>0 ? 1.2 : 1.0);
  sonicMesh.scale.y = THREE.MathUtils.lerp(sonicMesh.scale.y, sFactor, 0.2);
  sonicMesh.scale.x = THREE.MathUtils.lerp(sonicMesh.scale.x, 2-sFactor, 0.2);

  sonicMesh.position.set(s.x, s.y, s.z);

  // Collect rings
  for(const r of collectRings) {
    if(r.collected) continue;
    if(Math.abs(s.x-r.x)<1.2 && Math.abs(s.y-r.y)<1.2 && Math.abs(s.z-r.z)<1.2) {
      r.collected=true; scene.remove(r.mesh);
      ringCount++; document.getElementById('ring-count').textContent=ringCount;
      spawnParticle(r.mesh.position.clone(), 0xFFD700, new THREE.Vector3(0,0.15,0));
    }
  }
  // Rotate rings
  for(const r of collectRings) if(!r.collected) r.mesh.rotation.y+=0.05;

  // Enemies
  for(const b of badniks) {
    if(b.stomped) continue;
    b.x+=b.vx; b.mesh.position.x=b.x;
    b.mesh.rotation.y+=0.04;
    if(Math.abs(b.x-b.startX)>b.rangeX){ b.vx*=-1; }
    // Stomp check
    if(!s.spinning && Math.abs(s.x-b.x)<1.1 && Math.abs(s.z-b.z)<1.1) {
      if(s.y-0.6 > b.y-0.6 && s.vy<0) {
        b.stomped=true; scene.remove(b.mesh);
        s.vy=0.5;
        ringCount+=5; document.getElementById('ring-count').textContent=ringCount;
        for(let i=0;i<16;i++) spawnParticle(b.mesh.position.clone(),0xff4444,new THREE.Vector3((Math.random()-0.5)*0.3,0.1+Math.random()*0.3,(Math.random()-0.5)*0.3));
      } else if(s.invincible===0) {
        ringCount=Math.max(0,ringCount-5);
        document.getElementById('ring-count').textContent=ringCount;
        s.invincible=80;
        const angle=Math.random()*Math.PI*2;
        s.vx=Math.cos(angle)*0.4; s.vy=0.5; s.vz=Math.sin(angle)*0.3;
        for(let i=0;i<12;i++) spawnParticle(sonicMesh.position.clone(),0xFFD700,new THREE.Vector3((Math.random()-0.5)*0.4,0.15+Math.random()*0.3,(Math.random()-0.5)*0.4));
      }
    } else if(s.spinning && Math.abs(s.x-b.x)<1.2 && Math.abs(s.z-b.z)<1.2 && Math.abs(s.y-b.y)<1.5) {
      b.stomped=true; scene.remove(b.mesh);
      ringCount+=5; document.getElementById('ring-count').textContent=ringCount;
      for(let i=0;i<16;i++) spawnParticle(b.mesh.position.clone(),0xff4444,new THREE.Vector3((Math.random()-0.5)*0.3,0.15+Math.random()*0.3,(Math.random()-0.5)*0.3));
    }
  }

  // Warp ring
  if(warpRing && warpRing.active) {
    warpRing.update();
    if(warpRing.portalActive) {
      const pp=warpRing.portal.position;
      if(Math.abs(s.x-pp.x)<2.5 && Math.abs(s.z-pp.z)<2.5 && Math.abs(s.y-pp.y)<2.5) {
        warpRing.destroy(); warpRing=null;
        const next=(currentZone+1)%ZONES.length;
        teleportToZone(next);
      }
    }
  }

  // Speed lines
  const vel = Math.sqrt(s.vx*s.vx+s.vz*s.vz);
  for(const l of speedLines) {
    l.material.opacity = Math.min(0.6, (vel-0.2)*1.5);
  }

  // Invincibility flicker
  sonicMesh.visible = !(s.invincible>0 && Math.floor(s.invincible/6)%2===0);

  // Camera
  updateCamera();

  updateParticles();
}

function updateCamera() {
  const s = sonicState;
  const tx = s.x - Math.sin(camAngle)*camDist*Math.cos(camPitch);
  const ty = s.y + Math.sin(camPitch)*camDist;
  const tz = s.z - Math.cos(camAngle)*camDist*Math.cos(camPitch);
  cam.position.lerp(new THREE.Vector3(tx,ty,tz), 0.1);
  cam.lookAt(s.x, s.y+1, s.z);
  sunLight.target.position.set(s.x,0,s.z);
  sunLight.position.set(s.x+20, 40, s.z+20);
}

// ─── Start ────────────────────────────────────────────────────────────────────
function startGame() {
  document.getElementById('overlay').style.display='none';
  gameRunning=true;
  sonicMesh = buildSonic();
  scene.add(sonicMesh);
  buildSpeedLines();
  buildZone(0);
}

// ─── Loop ─────────────────────────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  update();
  renderer.render(scene, cam);
}
loop();
</script>
